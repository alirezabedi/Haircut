<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>body{margin:0;background:var(--background);color:var(--foreground);font-family:var(--font-sans);letter-spacing:-0.02em}*{box-sizing:border-box}.wrap{padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:520px}
.btn{height:52px;border-radius:var(--radius-md);border:0;font:600 16px/1 var(--font-sans);letter-spacing:-0.02em;cursor:pointer;padding:0 20px}
.primary{background:var(--primary);color:var(--on-primary);box-shadow:var(--shadow-sm)}
.secondary{background:var(--secondary);color:var(--secondary-foreground)}
.ghost{background:transparent;color:var(--primary-ink)}
.btn:focus-visible{outline:2px solid var(--primary-ink);outline-offset:2px}
.btn:disabled{opacity:.5;cursor:default}</style>
<div class="wrap">
 <button class="btn primary">Approve this cut</button>
 <button class="btn secondary">Try again</button>
 <button class="btn ghost">Retake photos</button>
 <button class="btn primary" disabled>Generating…</button>
</div>
