<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>body{margin:0;background:var(--background);color:var(--foreground);font-family:var(--font-sans);letter-spacing:-0.02em}*{box-sizing:border-box}.row{padding:16px;display:grid;grid-template-columns:repeat(4,1fr);gap:12px;max-width:560px}
.slot{position:relative;aspect-ratio:3/4;border-radius:var(--radius-lg);background:var(--muted);display:flex;align-items:center;justify-content:center;color:var(--muted-foreground)}
.slot.active{background:var(--card);box-shadow:var(--shadow-md);outline:2px solid var(--primary);color:var(--primary-ink)}
.slot.done{background:var(--chart-5);overflow:hidden}
.ph{position:absolute;inset:0;background:linear-gradient(var(--chart-2),var(--chart-5))}
.head{width:46%}
.tag{position:absolute;left:8px;bottom:8px;font:600 12px/16px var(--font-sans);letter-spacing:.03em;text-transform:uppercase}
.done .tag{color:oklch(0.9755 0.0067 97.3510)}
.ok{position:absolute;top:8px;right:8px;width:22px;height:22px;border-radius:9999px;background:var(--primary);color:var(--on-primary);font:600 13px/22px var(--font-sans);text-align:center}</style>
<div class="row">
 <div class="slot done"><div class="ph"></div><span class="tag">Front</span><span class="ok">✓</span></div>
 <div class="slot active"><svg viewBox="0 0 64 80" class="head"><path d="M32 8c-13 0-20 10-20 24 0 9 3 15 7 20l-2 20h30l-2-20c4-5 7-11 7-20C52 18 45 8 32 8z" fill="none" stroke="currentColor" stroke-width="1.5"/></svg><span class="tag">Left side</span></div>
 <div class="slot"><svg viewBox="0 0 64 80" class="head"><path d="M32 8c-13 0-20 10-20 24 0 9 3 15 7 20l-2 20h30l-2-20c4-5 7-11 7-20C52 18 45 8 32 8z" fill="none" stroke="currentColor" stroke-width="1.5"/></svg><span class="tag">Right side</span></div>
 <div class="slot"><svg viewBox="0 0 64 80" class="head"><path d="M32 8c-13 0-20 10-20 24 0 9 3 15 7 20l-2 20h30l-2-20c4-5 7-11 7-20C52 18 45 8 32 8z" fill="none" stroke="currentColor" stroke-width="1.5"/></svg><span class="tag">Back</span></div>
</div>
<script></script>
