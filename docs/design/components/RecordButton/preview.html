<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>body{margin:0;background:var(--background);color:var(--foreground);font-family:var(--font-sans);letter-spacing:-0.02em}*{box-sizing:border-box}.row{padding:24px;display:flex;gap:56px;align-items:flex-start}
.cell{display:flex;flex-direction:column;align-items:center;gap:12px}
.rec{width:80px;height:80px;border-radius:9999px;border:2px solid var(--border);background:var(--card);box-shadow:var(--shadow-md);display:flex;align-items:center;justify-content:center;cursor:pointer}
.rec:focus-visible{outline:2px solid var(--primary-ink);outline-offset:2px}
.dot{width:28px;height:28px;border-radius:9999px;background:var(--destructive)}
.live{border-color:var(--destructive)}
.sq{width:24px;height:24px;border-radius:6px;background:var(--destructive)}
.cap{font:400 14px/20px var(--font-sans);color:var(--muted-foreground)}
.num{font:500 14px/20px var(--font-mono);color:var(--foreground)}</style>
<div class="row">
 <div class="cell"><button class="rec" aria-label="Record"><span class="dot"></span></button><span class="cap">Tap to record</span></div>
 <div class="cell"><button class="rec live" aria-label="Stop"><span class="sq"></span></button><span class="cap num">0:24</span></div>
</div>
<script></script>
