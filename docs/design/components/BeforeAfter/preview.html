<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>body{margin:0;background:var(--background);color:var(--foreground);font-family:var(--font-sans);letter-spacing:-0.02em}*{box-sizing:border-box}.frame{position:relative;margin:16px;width:240px;height:288px;border-radius:var(--radius-xl);overflow:hidden;box-shadow:var(--shadow-md)}
.img{position:absolute;inset:0}
.before{background:linear-gradient(160deg,var(--chart-4),var(--chart-5))}
.after{background:linear-gradient(160deg,var(--chart-2),var(--chart-5));clip-path:inset(0 0 0 50%)}
.tag{position:absolute;top:12px;left:12px;font:600 12px/16px var(--font-sans);letter-spacing:.03em;text-transform:uppercase;background:var(--card);color:var(--foreground);padding:4px 8px;border-radius:var(--radius-sm)}
.t2{left:auto;right:12px}
.handle{position:absolute;top:0;bottom:0;left:50%;width:2px;background:var(--card)}
.knob{position:absolute;top:50%;left:-19px;width:40px;height:40px;margin-top:-20px;border-radius:9999px;background:var(--card);color:var(--foreground);box-shadow:var(--shadow-md);display:flex;align-items:center;justify-content:center;font:600 16px var(--font-sans)}</style>
<div class="frame">
 <div class="img before"><span class="tag">Before</span></div>
 <div class="img after"><span class="tag t2">Preview</span></div>
 <div class="handle"><span class="knob">⇆</span></div>
</div>
<script></script>
